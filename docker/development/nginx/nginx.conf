worker_processes auto;                      # Hexa core - due to HT 12 vCPU so auto is a lil' bit overkill with 12 workers  
error_log /var/www/error2.log info;        
worker_rlimit_nofile 1000000;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  'RHost: $remote_addr - Host var: $host [$time_local] - Http_host var: $http_host "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"'
                      ' - Request time: $request_time';

    sendfile on;
    # Testing, Benchmarking
    tcp_nopush on;
    tcp_nodelay on;
    # Per client keep alive (Stress test/benchmark)
    keepalive_requests 100000;
    # Allow the server to close non responding connections (Memory)
    reset_timedout_connection on;
    # Request time out (60 default)
    client_body_timeout 10;
    # Send timeout client (60 default)
    send_timeout 5;
    # Keepalive timeout (default 75)
    keepalive_timeout 30;

    # Gzip
    gzip on;
    gzip_min_length 10240;
    gzip_comp_level 1;
    gzip_vary on;
    gzip_disable msie6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # SSL Protocols and ciphers (no lower than TLSv2, TLSv3 for HTTP/3) 
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS';
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/dhparam.pem;

    # (Alternative) ssl_session_ticket_key for SSL cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
    
    # Privacy respecting DNS resolvers
    resolver 1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001];
    resolver_timeout 5s;

    # HTTP/3 settings, guic_gso only for linux, quick_retry for address validation (ssl_early_data still looking into with laravel)
    http3_stream_buffer_size 1m;
    quic_gso on;
    quic_retry on;
    quic_host_key /var/www/quic_host.key;

    server {
        access_log /var/www/storage/logs/access-nossl.log main; 
        listen 80 default_server;
        listen [::]:80 default_server;

        # Reject all other host names
        if ( $host !~* ^(codeanalyzer.bronk-ict.nl)$ ) {
            return 444;
        }

        set $correct_host 0;

        if ( $http_host ~* ^(codeanalyzer.bronk-ict.nl)$ ) {
            set $correct_host 1;
        }

        if ( $http_host = "" ) {
            set $correct_host 1;
        }

        if ( $correct_host = 0 ) {
            return 444;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {      
        access_log /var/www/storage/logs/access.log main; # OFF FOR BENCHMARK/STRESS TEST, our default: /var/www/access2.log main;

        listen 443 quic reuseport;          # HTTP3/QUIC + reuseport  || (UDP) IPv4
        listen [::]:443 quic reuseport;     # HTTP3/QUIC + reuseport  || (UDP) IPv6
        listen 443 ssl;                     # HTTP2 (TCP)
        listen [::]:443 ssl;                # HTTP2 (TCP)
        
        server_name codeanalyzer.bronk-ict.nl;
        root /var/www/public;
        index index.php index.html;

        http2 on;   # Enable HTTP2 
        http3 on;   # Enable HTTP3 (probably obsolete)

        # Reject all other host names
        if ( $host !~* ^(codeanalyzer.bronk-ict.nl)$ ) {
            return 444;
        }

        set $correct_host 0;

        if ( $http_host ~* ^(codeanalyzer.bronk-ict.nl)$ ) {
            set $correct_host 1;
        }

        if ( $http_host = "" ) {
            set $correct_host 1;
        }

        if ( $correct_host = 0 ) {
            return 444;
        }
        
        # SSL Certificates
        ssl_certificate /var/www/bronk-chain.pem;
        ssl_certificate_key /var/www/bronk-key.key;
        # Security headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Robots-Tag none;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
        # HTTP/3 Header
        add_header Alt-Svc 'h3=":443"; ma=2592000, h3-29=":443"; ma=2592000; persist=1' always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/tmp/docker/php.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTP_HOST $host;
        }
    }
}
